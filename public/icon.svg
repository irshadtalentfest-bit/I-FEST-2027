<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#iconBg)"/>

  <!-- Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,6" opacity="0.6"/>

  <!-- Central Crest Content (Within 80% Safe Zone) -->
  <g transform="translate(0, 10)">
    <!-- Torch / Star Icon -->
    <path d="M 256 95 C 275 125, 280 145, 256 175 C 232 145, 237 125, 256 95 Z" fill="#fbbf24"/>
    <polygon points="256,120 260,132 272,133 262,142 265,154 256,147 247,154 250,142 240,133 252,132" fill="#ffffff"/>

    <!-- I-FEST Typography -->
    <text x="256" y="260" font-family="'Cinzel', Georgia, serif" font-size="82" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="3">
      I-FEST
    </text>

    <!-- IRSHAD Sub-header -->
    <rect x="96" y="285" width="320" height="46" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="256" y="316" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="2">
      IRSHAD TALENT FEISTA
    </text>

    <!-- 2027 -->
    <text x="256" y="390" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="8">
      2027
    </text>
  </g>
</svg>
